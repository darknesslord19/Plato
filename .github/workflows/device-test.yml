# Gerçek CloudStream eklentilerini Android emülatöründe Play'in kendi yükleyicisiyle çalıştırır.
# Her eklenti: indirildi mi, yüklendi mi, ana sayfa/arama sonuç verdi mi? Sonuç Actions özetinde ve notlarda.
# Yalnızca CloudStream ile ilgili kod değişince çalışır; yayın derlemesini (build.yml) beklemez ve engellemez.

name: Cihaz denemesi (CloudStream)

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/com/kaan/play/data/cloudstream/**"
      - "app/src/main/java/com/lagradost/**"
      - "app/src/androidTest/java/com/kaan/play/data/cloudstream/**"
      - "app/build.gradle.kts"
      - "app/proguard-rules.pro"
      - "gradle/libs.versions.toml"
      - "tools/cs_repos_device.list"
      - ".github/workflows/device-test.yml"
      - ".github/scripts/cs-device-*"

concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  device:
    name: Emülatörde gerçek eklentiler
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        run: bash .github/scripts/android-sdk.sh

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Debug ve test APK'larını derle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: bash .github/scripts/gradle.sh assembleDebug assembleDebugAndroidTest

      - name: Emülatörde çalıştır
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/cs-device-run.sh

      - name: Sonuç
        if: always()
        run: python3 .github/scripts/cs-device-summary.py build/cs-device/report.json

      - name: Raporu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-cihaz-denemesi
          path: build/cs-device/
          retention-days: 14
          if-no-files-found: ignore
