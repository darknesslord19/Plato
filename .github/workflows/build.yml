# Play — otomatik derleme (GitHub Actions)
#
# Her main gönderiminde (ve Actions sekmesinden elle "Run workflow" ile):
#   1. "Testler" işi birim testlerini çalıştırır (bozuk kod görünür olsun).
#   2. "APK" işi imzalı release APK'sını derler, çalıştırmanın Artifacts bölümüne koyar
#      ve main'deyse "v<sürüm>" etiketiyle bir GitHub Release yayımlar
#      (Play-<sürüm>.apk + Play-<sürüm>-SHA256.txt; uygulama içi güncelleme bunları bulur).
#
# Sürüm: build.gradle.kts'teki taban sürüme çalıştırma numarası eklenir (ör. 1.1.4 → 1.1.4.7),
# böylece her derleme bir öncekinden yenidir ve uygulama içi güncelleme çalışır.
#
# Depo ayarları > Secrets and variables > Actions altında tanımlanacak gizli değerler:
#   TMDB_API_KEY      (gerekli)  themoviedb.org v3 API anahtarı; yoksa ana sayfa/arama çalışmaz.
#   KEYSTORE_BASE64   (önerilir) imza anahtar dosyasının base64 hâli (takma ad: play).
#   KEYSTORE_PASSWORD (önerilir) anahtar deposu şifresi.
#   KEY_PASSWORD      (isteğe bağlı) anahtar şifresi; yoksa KEYSTORE_PASSWORD kullanılır.
#   SUBDL_API_KEY     (isteğe bağlı) SubDL altyazı araması; yoksa SubDL atlanır.
# İmza anahtarı yoksa her derleme geçici bir anahtarla imzalanır: APK kurulur ama
# bir sonraki derleme eskisinin üzerine kurulamaz (önce kaldırmak gerekir).

name: Derleme

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "announcements.json"
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Testler
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        run: bash .github/scripts/android-sdk.sh

      - name: Birim testleri
        run: bash .github/scripts/gradle.sh testDebugUnitTest

      - name: Test raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/
          retention-days: 14

  apk:
    name: APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Android SDK
        run: bash .github/scripts/android-sdk.sh

      - name: Sürüm numarası
        id: version
        run: |
          base_name=$(sed -nE 's/.*\?: "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' app/build.gradle.kts | head -1)
          base_code=$(sed -nE 's/.*PLAY_VERSION_CODE.*\?: ([0-9]+).*/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$base_name" ] || [ -z "$base_code" ]; then
            echo "::error::Taban sürüm build.gradle.kts içinden okunamadı."
            exit 1
          fi
          name="${base_name}.${GITHUB_RUN_NUMBER}"
          code=$(( base_code * 1000 + GITHUB_RUN_NUMBER ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $name ($code)"

      - name: İmza anahtarı
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/play-release.keystore
            echo "kind=stable" >> "$GITHUB_OUTPUT"
            echo "Kalıcı imza anahtarı kullanılıyor."
          else
            pass=$(openssl rand -hex 16)
            echo "::add-mask::$pass"
            keytool -genkeypair -keystore keystore/play-release.keystore -alias play \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$pass" -dname "CN=Play temporary" >/dev/null 2>&1
            echo "TEMP_KEYSTORE_PASSWORD=$pass" >> "$GITHUB_ENV"
            echo "kind=temporary" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64/KEYSTORE_PASSWORD tanımlı değil; geçici anahtarla imzalanıyor. Bu APK bir sonrakinin üzerine kurulamaz."
          fi

      - name: TMDB anahtarı denetimi
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::warning::TMDB_API_KEY tanımlı değil; APK derlenir ama ana sayfa ve arama boş kalır."
          fi

      - name: Release APK derle
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_VERSION_NAME: ${{ steps.version.outputs.name }}
          PLAY_VERSION_CODE: ${{ steps.version.outputs.code }}
          PLAY_UPDATE_REPO: ${{ github.repository }}
        run: |
          if [ -n "$TEMP_KEYSTORE_PASSWORD" ]; then
            export KEYSTORE_PASSWORD="$TEMP_KEYSTORE_PASSWORD" KEY_PASSWORD="$TEMP_KEYSTORE_PASSWORD"
          elif [ -z "$KEY_PASSWORD" ]; then
            export KEY_PASSWORD="$KEYSTORE_PASSWORD"
          fi
          bash .github/scripts/gradle.sh assembleRelease
          ls -l app/build/outputs/apk/release/

      - name: APK imzasını doğrula
        run: |
          apk="app/build/outputs/apk/release/Play-${{ steps.version.outputs.name }}.apk"
          test -f "$apk" || { echo "::error::$apk bulunamadı"; exit 1; }
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::warning::apksigner bulunamadı; imza doğrulaması atlandı."
            exit 0
          fi
          if ! "$apksigner" verify --print-certs "$apk" > /tmp/apksigner.txt 2>&1; then
            msg=$(tail -5 /tmp/apksigner.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=APK imzası::$msg"
            exit 1
          fi
          grep -iE "certificate (DN|SHA-256)" /tmp/apksigner.txt || true

      - name: Anahtar dosyasını sil
        if: always()
        run: rm -f keystore/play-release.keystore

      - name: CloudStream eklenti uyumluluğu
        # Gerçek depolardaki eklentilerin çağırdığı her sınıf/metot bu APK'da var mı? (tools/cs_plugin_abi_check.py)
        # Bilgi amaçlıdır: üçüncü taraf eklentilerdeki bir eksik derlemeyi durdurmaz; sonuç notlarda ve özet sayfasında.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
        run: |
          python3 tools/cs_plugin_abi_check.py \
            --apk "app/build/outputs/apk/release/Play-$NAME.apk" \
            --repos tools/cs_repos.list --out build/cs-abi --cache build/cs-plugins
          # Karşılaştırma için bir önceki yayımlanmış sürüm (varsa)
          mkdir -p build/prev
          if gh release download --repo "$GITHUB_REPOSITORY" --pattern 'Play-*.apk' --dir build/prev 2>/dev/null; then
            prev=$(ls build/prev/*.apk | head -1)
            python3 tools/cs_plugin_abi_check.py --apk "$prev" --repos tools/cs_repos.list \
              --out build/cs-abi-prev --cache build/cs-plugins > /tmp/prev.txt 2>&1 || true
            python3 -c "import json;d=json.load(open('build/cs-abi-prev/report.json'));c=d['counts'];print('::notice title=Önceki sürüm ($(basename $prev))::Uyumlu',c.get('ok',0),'/',c.get('ok',0)+c.get('broken',0),'(%%%.1f)'%d['okPercent'])" || true
          fi

      - name: Uyumluluk raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs-uyumluluk-${{ steps.version.outputs.name }}
          path: |
            build/cs-abi/report.md
            build/cs-abi/report.json
            build/cs-abi-prev/report.md
          retention-days: 30
          if-no-files-found: ignore

      - name: APK'yı yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Play-${{ steps.version.outputs.name }}
          path: |
            app/build/outputs/apk/release/Play-${{ steps.version.outputs.name }}.apk
            app/build/outputs/apk/release/Play-${{ steps.version.outputs.name }}-SHA256.txt
          retention-days: 30
          if-no-files-found: error

      - name: GitHub Release yayımla
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.version.outputs.name }}
          SIGNING: ${{ steps.signing.outputs.kind }}
        run: |
          dir=app/build/outputs/apk/release
          notes="Otomatik derleme: ${GITHUB_SHA::7}"
          if [ "$SIGNING" = "temporary" ]; then
            notes="$notes

          ⚠️ Geçici anahtarla imzalandı: önceki sürümün üzerine kurulamaz, önce kaldırman gerekir. Depo ayarlarına KEYSTORE_BASE64 ve KEYSTORE_PASSWORD ekleyince bu sorun kalkar."
          fi
          if ! gh release create "v$NAME" \
            "$dir/Play-$NAME.apk" "$dir/Play-$NAME-SHA256.txt" \
            --target "$GITHUB_SHA" --title "Play $NAME" --notes "$notes" --latest > /tmp/release.txt 2>&1; then
            cat /tmp/release.txt
            msg=$(tail -5 /tmp/release.txt | sed -e ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=GitHub Release::$msg"
            exit 1
          fi
          cat /tmp/release.txt
